name: Update Homebrew tap

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.1.0)"
        required: true

jobs:
  bump-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Compute release tarball checksum
        id: checksum
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          curl -sSfL "$URL" -o release.tar.gz
          echo "sha256=$(sha256sum release.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check out tap
        uses: actions/checkout@v4
        with:
          repository: theitger/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update formula
        run: |
          FORMULA=tap/Formula/lernspiegel.rb
          sed -i \
            -e 's|^  url ".*"$|  url "${{ steps.checksum.outputs.url }}"|' \
            -e 's|^  sha256 ".*"$|  sha256 "${{ steps.checksum.outputs.sha256 }}"|' \
            "$FORMULA"
          if git -C tap diff --quiet; then
            echo "Formula already up to date, nothing to push."
            exit 0
          fi
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap commit -am "lernspiegel ${{ github.event.release.tag_name }}"
          git -C tap push
